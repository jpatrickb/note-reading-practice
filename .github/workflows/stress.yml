# Manual flake-hunting on a CI runner (local machines stay light). Never runs on push or PR:
#   gh workflow run stress.yml --ref <branch> -f grep='Letter Math' -f repeat=20 -f unit_loops=10
name: Stress

on:
  workflow_dispatch:
    inputs:
      spec:
        description: Playwright spec file(s) to run
        default: e2e/letters.spec.ts e2e/pwa.spec.ts
      grep:
        description: Playwright --grep filter (optional)
        default: ''
      repeat:
        description: Playwright --repeat-each
        default: '20'
      workers:
        description: Playwright workers
        default: '4'
      unit_loops:
        description: Times to run the whole unit suite (0 to skip)
        default: '0'

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPEC: ${{ inputs.spec }}
      GREP: ${{ inputs.grep }}
      REPEAT: ${{ inputs.repeat }}
      WORKERS: ${{ inputs.workers }}
      UNIT_LOOPS: ${{ inputs.unit_loops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Unit tests, repeated
        if: env.UNIT_LOOPS != '0'
        run: |
          fails=0
          for i in $(seq 1 "$UNIT_LOOPS"); do npx vitest run --reporter=dot || fails=$((fails+1)); done
          echo "unit suite: $fails failing runs of $UNIT_LOOPS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$fails" = 0
      - name: Install browsers
        if: env.SPEC != ''
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright, repeated (no retries)
        if: env.SPEC != ''
        run: |
          args=()
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          npx playwright test $SPEC "${args[@]}" --repeat-each="$REPEAT" --workers="$WORKERS" --retries=0 --reporter=list 2>&1 | tee out.txt
          exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always() && env.SPEC != ''
        run: grep -E "^\s+[0-9]+ (passed|failed|flaky)" out.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
