# Weekly, grouped updates into develop: keeps pinned action SHAs, npm packages, and the Cloudflare
# provider current without a flood of PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: terraform
    directory: /infra
    target-branch: develop
    schedule: { interval: weekly }
